<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日推情报中心</title>
<style>
  :root {
    --bg: #0f0f14;
    --card-bg: #1a1a24;
    --border: #2a2a3a;
    --text: #e0e0e0;
    --muted: #888;
    --orange: #ff6b35;
    --blue: #4da6ff;
    --gold: #c9a84c;
    --green: #4caf84;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header .date {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
  }
  .header h1 {
    font-size: 28px;
    margin-top: 10px;
    background: linear-gradient(135deg, #ff6b35, #4da6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .hint {
    font-size: 12px;
    color: #555;
    margin-top: 6px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 680px;
    width: 100%;
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px;
    text-decoration: none;
    transition: border-color 0.2s, transform 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    color: inherit;
  }
  .card:hover {
    border-color: #555;
    transform: translateY(-2px);
  }
  .card .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .card .info { flex: 1; }
  .card h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .card .time {
    font-size: 11px;
    color: #555;
    margin-top: 6px;
  }

  /* 新闻联播 */
  .card.news .icon { background: rgba(255,107,53,0.15); }
  .card.news h3 { color: var(--orange); }
  .card.news:hover { border-color: rgba(255,107,53,0.4); }

  /* AI情报 */
  .card.ai .icon { background: rgba(77,166,255,0.15); }
  .card.ai h3 { color: var(--blue); }
  .card.ai:hover { border-color: rgba(77,166,255,0.4); }

  /* 食研日推 */
  .card.food .icon { background: rgba(240,192,96,0.15); }
  .card.food h3 { color: #f0c060; }
  .card.food:hover { border-color: rgba(240,192,96,0.4); }

  /* 财商日推 */
  .card.money .icon { background: rgba(201,168,76,0.15); }
  .card.money h3 { color: var(--gold); }
  .card.money:hover { border-color: rgba(201,168,76,0.4); }

  /* 生鲜情报 */
  .card.fresh .icon { background: rgba(76,175,132,0.15); }
  .card.fresh h3 { color: var(--green); }
  .card.fresh:hover { border-color: rgba(76,175,132,0.4); }

  .footer {
    margin-top: 36px;
    text-align: center;
    font-size: 12px;
    color: #555;
    line-height: 1.8;
  }
  .footer a { color: #777; text-decoration: none; }
  .footer a:hover { color: var(--blue); }
</style>
</head>
<body>

<div class="header">
  <div class="date" id="headerDate"></div>
  <h1>日推情报中心</h1>
  <div class="hint">点卡片直达今日份报告 · 每天 9:00 自动刷新</div>
</div>

<div class="grid">

  <a class="card news" id="link-news" href="#">
    <div class="icon">📺</div>
    <div class="info">
      <h3>新闻联播简报</h3>
      <p>每日风向标解读</p>
      <div class="time">9:00 更新</div>
    </div>
  </a>

  <a class="card ai" id="link-ai" href="#">
    <div class="icon">🚀</div>
    <div class="info">
      <h3>AI 生产力情报</h3>
      <p>黑科技 · Agent · 套利线索</p>
      <div class="time">9:00 更新</div>
    </div>
  </a>

  <a class="card food" id="link-food" href="#">
    <div class="icon">🍳</div>
    <div class="info">
      <h3>食研日推</h3>
      <p>行业要闻 · 爆品雷达 · 跨界灵感</p>
      <div class="time">9:00 更新</div>
    </div>
  </a>

  <a class="card money" id="link-money" href="#">
    <div class="icon">💰</div>
    <div class="info">
      <h3>财商日推</h3>
      <p>回到那一天 · 概念卡 · 今日行动</p>
      <div class="time">9:15 更新</div>
    </div>
  </a>

  <a class="card fresh" id="link-fresh" href="#">
    <div class="icon">🌶️</div>
    <div class="info">
      <h3>生鲜作战情报</h3>
      <p>精品风向标 · 行动建议 · 内容日历</p>
      <div class="time">9:00 更新</div>
    </div>
  </a>

</div>

<div class="footer">
  <p>每天 9:00 自动生成 · <a href="https://github.com/mryyyyyy/daily-intelligence">GitHub 仓库</a></p>
  <p style="margin-top:4px;">收藏此页：<strong>mryyyyyy.github.io/daily-intelligence</strong></p>
</div>

<script>
  // 自动生成今天的日期并填入所有链接
  (function() {
    var now = new Date();
    var y = now.getFullYear();
    var m = String(now.getMonth() + 1).padStart(2, '0');
    var d = String(now.getDate()).padStart(2, '0');
    var ds = y + '-' + m + '-' + d;
    var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    var wd = weekdays[now.getDay()];

    document.getElementById('headerDate').textContent = ds + ' 星期' + wd;
    document.getElementById('link-news').href = 'daily-news-' + ds + '.html';
    document.getElementById('link-ai').href = 'daily-news-' + ds + '.html';
    document.getElementById('link-food').href = '食研日推-' + ds + '.html';
    document.getElementById('link-money').href = '财商日推-' + ds + '.html';
    document.getElementById('link-fresh').href = '生鲜情报_' + ds + '.html';
  })();
</script>

</body>
</html>
